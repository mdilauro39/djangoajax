<div class="modal-header text-white" style="background-color: #6b21a8;">
    <h5 class="modal-title fw-bold" id="agenteModalLabel">
        <i class="bi bi-person-badge-fill me-2"></i>Ficha del Profesional
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body p-4">
    <div class="d-flex align-items-center gap-4 mb-4">
        <!-- Avatar gigante -->
        <div class="shadow-sm d-flex align-items-center justify-content-center text-primary" 
             style="background-color: #eff6ff; width: 90px; height: 90px; border-radius: 50%; border: 3px solid #6b21a8;">
            <i class="bi bi-person-fill fs-1" style="color: #6b21a8;"></i>
        </div>
        <div>
            <h4 class="fw-bold text-dark mb-1">{{ agente.nombre }}</h4>
            <span class="badge {% if agente.activo_ahora %}bg-success{% else %}bg-danger{% endif %} rounded-pill px-3">
                {% if agente.activo_ahora %}Activo en el Sistema{% else %}Fuera de Línea{% endif %}
            </span>
        </div>
    </div>

    <table class="table table-striped table-bordered border-light m-0">
        <tbody>
            <tr>
                <th scope="row" class="text-secondary small fw-bold text-uppercase w-25">ID Agente</th>
                <td class="text-dark fw-mono">#{{ agente.id }}</td>
            </tr>
            <tr>
                <th scope="row" class="text-secondary small fw-bold text-uppercase">Especialidad</th>
                <td class="text-dark">{{ agente.especialidad }}</td>
            </tr>
            <tr>
                <th scope="row" class="text-secondary small fw-bold text-uppercase">📍 Ciudad</th>
                <td class="text-dark">{{ agente.ciudad }}</td>
            </tr>
            <tr>
                <th scope="row" class="text-secondary small fw-bold text-uppercase">⭐ Puntuación</th>
                <td class="text-dark fw-bold text-warning">
                    <i class="bi bi-star-fill me-1"></i>{{ agente.rating }} / 5.0
                </div></td>
            </tr>
        </tbody>
    </table>
</div>
<div class="modal-footer bg-light">
    <button type="button" class="btn btn-secondary fw-semibold" data-bs-dismiss="modal">Cerrar Ficha</button>
</div>
