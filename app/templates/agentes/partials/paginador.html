{% if agentes.has_other_pages %}
<nav aria-label="Navegación de resultados" class="mt-4">
    <ul class="pagination pagination-sm justify-content-center m-0">
        
        {% if agentes.has_previous %}
            <li class="page-item">
                <a class="page-link text-dark cursor-pointer" 
                   hx-get="?page={{ agentes.previous_page_number }}" 
                   hx-include="#formulario-filtros" 
                   hx-target="#contenedor-resultados">
                    &laquo; Anterior
                </a>
            </li>
        {% endif %}

        {% for num in agentes.paginator.page_range %}
            <li class="page-item {% if agentes.number == num %}active{% endif %}">
                <a class="page-link {% if agentes.number == num %}bg-dark border-dark text-white{% else %}text-dark{% endif %} cursor-pointer" 
                   hx-get="?page={{ num }}" 
                   hx-include="#formulario-filtros" 
                   hx-target="#contenedor-resultados">
                    {{ num }}
                </a>
            </li>
        {% endfor %}

        {% if agentes.has_next %}
            <li class="page-item">
                <a class="page-link text-dark cursor-pointer" 
                   hx-get="?page={{ agentes.next_page_number }}" 
                   hx-include="#formulario-filtros" 
                   hx-target="#contenedor-resultados">
                    Siguiente &raquo;
                </a>
            </li>
        {% endif %}
        
    </ul>
</nav>
{% endif %}
