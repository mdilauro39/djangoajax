<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Agents - Buscador</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .navbar-custom { background-color: #1a365d; }
        
        /* Contenedores con bordes redondeados y estilo similar a la imagen */
        .box-container { border: 2px solid #6b21a8; border-radius: 1rem; background-color: #ffffff; padding: 1.5rem; }
        
        /* Estilos de la tabla al estilo del panel */
        .table-custom-header { background-color: #6b21a8 !important; color: #ffffff !important; }
        .table tbody tr { vertical-align: middle; }
        
        /* Spinner de carga */
        .htmx-indicator { display: none !important; }
        .htmx-request .htmx-indicator { display: inline-block !important; }
    </style>
</head>
<body>

    <!-- 🌐 Barra de Navegación del Sistema -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <i class="bi bi-building-fill me-2 text-info fs-3"></i> 
                <span>CONSULTAS DE AGENTES</span>
            </a>
            <div class="text-white fs-4"><i class="bi bi-house-door-fill"></i></div>
        </div>
    </nav>

    <div class="container-fluid px-4 my-4">
        
        <!-- 🛠️ Cuadro Superior: Formulario de Filtros Unificado -->
        <div class="box-container mb-4">
            <h5 class="fw-bold mb-3 text-dark">Buscar agente del sistema</h5>
            <p class="text-muted small mb-4">Complete los campos para filtrar la lista en tiempo real de forma automática.</p>
            
            <form id="formulario-filtros">
                <div class="row g-3 align-items-end">
                    
                    <!-- Fila de Inputs -->
                    <div class="col-md-10">
                        <div class="row g-3">
                            <!-- Nombre -->
                            <div class="col-md-6">
                                <label for="buscar" class="form-label small fw-bold text-secondary">Nombre / Apellido</label>
                                <input type="text" name="q" id="buscar" class="form-control" placeholder="Escriba para buscar..."
                                       hx-get="{% url 'buscador_agentes' %}" hx-trigger="keyup delay:300ms changed" hx-target="#contenedor-resultados">
                            </div>
                            
                            <!-- Especialidad -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Especialidad</label>
                              <select name="especialidad" class="form-select" 
        hx-get="{% url 'buscador_agentes' %}" 
        hx-target="#contenedor-resultados"
        hx-include="#formulario-filtros"> <!-- 🟢 OBLIGATORIO: Incluye el resto del formulario -->
    <option value="">Todas las especialidades</option>
    {% for esp in especialidades %}
        <option value="{{ esp }}">{{ esp }}</option>
    {% endfor %}
</select>
                            </div>

                            <!-- Ciudad -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">📍 Ubicación Geográfica</label>
                                <select name="ciudad" class="form-select" 
        hx-get="{% url 'buscador_agentes' %}" 
        hx-target="#contenedor-resultados"
        hx-include="#formulario-filtros"> <!-- 🟢 OBLIGATORIO -->
    <option value="">Todas las ciudades</option>
    {% for c in ciudades %}
        <option value="{{ c }}">{{ c }}</option>
    {% endfor %}
</select>
                            </div>

                            <!-- Estado -->
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-secondary">Estado actual</label>
                                <select name="activo_ahora" class="form-select" 
        hx-get="{% url 'buscador_agentes' %}" 
        hx-target="#contenedor-resultados"
        hx-include="#formulario-filtros"> <!-- 🟢 OBLIGATORIO -->
    <option value="">Todos los estados</option>
    <option value="true">Activo ahora</option>
</select>
                            </div>
                        </div>
                    </div>

                    <!-- Columna del Botón Limpiar a la derecha -->
                    <div class="col-md-2 text-end">
                        <button type="button" class="btn btn-dark w-100 fw-semibold py-2" 
                                style="background-color: #6b21a8; border-color: #6b21a8;"
                                hx-get="{% url 'buscador_agentes' %}" hx-params="none" hx-target="#contenedor-resultados" 
                                onclick="document.getElementById('formulario-filtros').reset();">
                            <i class="bi bi-eraser-fill me-1"></i> Limpiar
                        </button>
                    </div>

                </div>
            </form>
            
            <div id="spinner-carga" class="htmx-indicator mt-3 text-primary small">
                <span class="spinner-border spinner-border-sm" role="status"></span> Actualizando registros...
            </div>
        </div>

        <!-- 🚀 Cuadro Inferior: Tabla de Resultados Dinámicos -->
        <div class="box-container">
            <div id="contenedor-resultados">
                {% include 'agentes/partials/lista_resultados.html' %}
            </div>
        </div>

    </div>
    <!-- Bootstrap 5 JS Bundle -->
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js">
</script>
</body>
</html>
